<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Samah Boudallaa - Data Engineering, Machine Learning et IA" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1b1038"/></linearGradient>
  <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity=".08"/></pattern>
  <path id="flow" d="M40 288 C 200 248, 320 316, 500 280 S 800 246, 960 286"/>
  <style>
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .title{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;font-size:60px;letter-spacing:1px;opacity:0;animation:rise 1.2s .2s forwards}
    .sub{font-size:19px;fill:#8b949e;opacity:0;animation:rise 1s .8s forwards}
    .l{font-size:20px;fill:#79c0ff;opacity:0;animation:cyc 12s infinite}
    .l2{animation-delay:4s}.l3{animation-delay:8s}
    .cur{animation:blink 1s steps(1) infinite}
    .node{animation:pulse 3s ease-in-out infinite}
    .orb{animation:float 7s ease-in-out infinite}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes cyc{0%{opacity:0;transform:translateY(8px)}4%,28%{opacity:1;transform:none}33%,100%{opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  </style>
</defs>
<rect width="1000" height="330" rx="18" fill="url(#bg)"/>
<rect width="1000" height="330" rx="18" fill="url(#grid)"/>
<circle class="orb" cx="880" cy="90" r="70" fill="#7c3aed" opacity=".18" filter="url(#glow)"/>
<circle class="orb" cx="120" cy="120" r="50" fill="#1f6feb" opacity=".18" filter="url(#glow)" style="animation-delay:-3s"/>
<!-- terminal bar -->
<circle cx="34" cy="30" r="6" fill="#ff5f56"/><circle cx="56" cy="30" r="6" fill="#ffbd2e"/><circle cx="78" cy="30" r="6" fill="#27c93f"/>
<text x="104" y="35" class="mono" font-size="13" fill="#6e7681">samah@data-platform ~ pipeline --status=running</text>
<!-- title -->
<text x="500" y="125" text-anchor="middle" class="title" fill="url(#acc)" filter="url(#glow)">SAMAH BOUDALLAA</text>
<text x="500" y="160" text-anchor="middle" class="mono sub">Bachelor Sciences des Données · Université Cadi Ayyad</text>
<!-- rotating lines -->
<g class="mono" text-anchor="middle">
  <text x="500" y="212" class="l">&gt; je construis des pipelines de données fiables_</text>
  <text x="500" y="212" class="l l2">&gt; de la donnée brute au modèle exposé par une API_</text>
  <text x="500" y="212" class="l l3">&gt; tests · conteneurs · supervision · CI/CD_</text>
</g>
<!-- data flow -->
<use href="#flow" fill="none" stroke="url(#acc)" stroke-width="2" stroke-opacity=".5" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2s" repeatCount="indefinite"/></use>
<g filter="url(#glow)">
  <circle r="5" fill="#58a6ff"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
  <circle r="5" fill="#a371f7"><animateMotion dur="5s" begin="1.2s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
  <circle r="5" fill="#3fb950"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
  <circle r="5" fill="#f0883e"><animateMotion dur="5s" begin="3.7s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
</g>
<g class="mono" font-size="12" fill="#c9d1d9">
  <circle class="node" cx="40" cy="288" r="7" fill="#58a6ff"/><text x="40" y="312" text-anchor="middle">Kafka</text>
  <circle class="node" cx="290" cy="283" r="7" fill="#3fb950" style="animation-delay:-.6s"/><text x="290" y="312" text-anchor="middle">Spark · ETL</text>
  <circle class="node" cx="500" cy="280" r="7" fill="#a371f7" style="animation-delay:-1.2s"/><text x="500" y="312" text-anchor="middle">ML · XGBoost</text>
  <circle class="node" cx="730" cy="262" r="7" fill="#f0883e" style="animation-delay:-1.8s"/><text x="730" y="312" text-anchor="middle">FastAPI</text>
  <circle class="node" cx="960" cy="286" r="7" fill="#ff7b72" style="animation-delay:-2.4s"/><text x="960" y="312" text-anchor="middle">Grafana</text>
</g>
</svg>
