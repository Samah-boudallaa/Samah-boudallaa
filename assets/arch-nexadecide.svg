<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">NexaDecide architecture</title>
<desc id="d">SQL Server, ETL pipeline, DuckDB and Parquet cache, FastAPI, then XGBoost forecast, RAG assistant and Streamlit interface. An Odoo CRM test instance exchanges data with the API over XML-RPC.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#171127"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1836"/><stop offset="1" stop-color="#14111f"/></linearGradient>
<radialGradient id="glow" cx="0.85" cy="0" r="0.8"><stop offset="0" stop-color="#7c3aed" stop-opacity=".30"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#a371f7"/></marker>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a371f7" opacity=".12"/></pattern>
<style>
text{font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.k{font-size:11px;font-weight:700;letter-spacing:1.6px;fill:#a371f7}
.t{font-size:19px;font-weight:700;fill:#f0f6fc}
.s{font-size:13px;fill:#9aa4b2}
.h{font-size:12px;font-weight:600;letter-spacing:1.8px;fill:#6e7681}
.l{font-size:12px;fill:#c4b5fd;font-style:italic}
.f{fill:none;stroke:#a371f7;stroke-width:2;stroke-dasharray:6 6;animation:d 1.4s linear infinite}
@keyframes d{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
</defs>
<rect width="1200" height="440" rx="20" fill="url(#bg)"/>
<rect width="1200" height="440" rx="20" fill="url(#dots)"/>
<rect width="1200" height="440" rx="20" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="439" rx="19.5" fill="none" stroke="#2d2547"/>
<text x="35" y="38" class="h">ARCHITECTURE · NEXADECIDE</text>

<g transform="translate(35,150)"><rect width="190" height="100" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#2dd4bf"/><text x="16" y="30" class="k" style="fill:#2dd4bf">SOURCE</text><text x="16" y="56" class="t">SQL Server</text><text x="16" y="78" class="s">operational data</text></g>
<g transform="translate(270,150)"><rect width="190" height="100" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#a371f7"/><text x="16" y="30" class="k">PIPELINE</text><text x="16" y="56" class="t">ETL pipeline</text><text x="16" y="78" class="s">443,154 records</text></g>
<g transform="translate(505,150)"><rect width="190" height="100" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#a371f7"/><text x="16" y="30" class="k">ANALYTICAL CACHE</text><text x="16" y="56" class="t">DuckDB · Parquet</text><text x="16" y="78" class="s">read in &lt; 100 ms</text></g>
<g transform="translate(740,150)"><rect width="190" height="100" rx="14" fill="url(#card)" stroke="#a371f7" stroke-opacity=".6"/><rect x="16" width="40" height="3" rx="1.5" fill="#a371f7"/><text x="16" y="30" class="k">SERVING</text><text x="16" y="56" class="t">FastAPI</text><text x="16" y="78" class="s">9 endpoints</text></g>

<path class="f" d="M227 200 H264" marker-end="url(#ar)"/>
<path class="f" d="M462 200 H499" marker-end="url(#ar)"/>
<path class="f" d="M697 200 H734" marker-end="url(#ar)"/>

<g transform="translate(975,40)"><rect width="190" height="90" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#f0abfc"/><text x="16" y="28" class="k" style="fill:#f0abfc">FORECASTING</text><text x="16" y="52" class="t">XGBoost forecast</text><text x="16" y="72" class="s">8.9% MAPE (simulated)</text></g>
<g transform="translate(975,155)"><rect width="190" height="90" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#f0abfc"/><text x="16" y="28" class="k" style="fill:#f0abfc">GENERATIVE AI</text><text x="16" y="52" class="t">RAG assistant</text><text x="16" y="72" class="s">LangChain · Mistral AI</text></g>
<g transform="translate(975,270)"><rect width="190" height="90" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#2dd4bf"/><text x="16" y="28" class="k" style="fill:#2dd4bf">INTERFACE</text><text x="16" y="52" class="t">Streamlit</text><text x="16" y="72" class="s">10 pages</text></g>

<path class="f" d="M932 200 C952 200 952 85 969 85" marker-end="url(#ar)"/>
<path class="f" d="M932 200 H969" marker-end="url(#ar)"/>
<path class="f" d="M932 200 C952 200 952 315 969 315" marker-end="url(#ar)"/>

<g transform="translate(740,320)"><rect width="190" height="90" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#fbbf24"/><text x="16" y="28" class="k" style="fill:#fbbf24">CRM · TEST INSTANCE</text><text x="16" y="52" class="t">Odoo CRM</text><text x="16" y="72" class="s">two-way exchange</text></g>
<path class="f" d="M835 254 V314" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="850" y="290" class="l">XML-RPC</text>
</svg>
