<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">Smart Data Pipeline architecture</title>
<desc id="d">Simulated IoT data, Kafka, adaptive Pandas and Spark engine, Isolation Forest anomaly detection and detection results. The engine also exposes Prometheus metrics shown in Grafana.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#171127"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1836"/><stop offset="1" stop-color="#14111f"/></linearGradient>
<radialGradient id="glow" cx="0.85" cy="0" r="0.8"><stop offset="0" stop-color="#7c3aed" stop-opacity=".30"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#a371f7"/></marker>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a371f7" opacity=".12"/></pattern>
<style>
text{font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.k{font-size:11px;font-weight:700;letter-spacing:1.6px;fill:#a371f7}
.t{font-size:19px;font-weight:700;fill:#f0f6fc}
.s{font-size:13px;fill:#9aa4b2}
.h{font-size:12px;font-weight:600;letter-spacing:1.8px;fill:#6e7681}
.l{font-size:12px;fill:#c4b5fd;font-style:italic}
.f{fill:none;stroke:#a371f7;stroke-width:2;stroke-dasharray:6 6;animation:d 1.4s linear infinite}
@keyframes d{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
</defs>
<rect width="1200" height="400" rx="20" fill="url(#bg)"/>
<rect width="1200" height="400" rx="20" fill="url(#dots)"/>
<rect width="1200" height="400" rx="20" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="399" rx="19.5" fill="none" stroke="#2d2547"/>
<text x="35" y="38" class="h">ARCHITECTURE · SMART DATA PIPELINE</text>

<g transform="translate(35,70)"><rect width="190" height="100" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#2dd4bf"/><text x="16" y="30" class="k" fill="#2dd4bf" style="fill:#2dd4bf">SOURCE</text><text x="16" y="56" class="t">IoT sensors</text><text x="16" y="78" class="s">simulated measurements</text></g>
<g transform="translate(270,70)"><rect width="190" height="100" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#a371f7"/><text x="16" y="30" class="k">STREAMING</text><text x="16" y="56" class="t">Apache Kafka</text><text x="16" y="78" class="s">KRaft mode</text></g>
<g transform="translate(505,70)"><rect width="190" height="100" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#a371f7"/><text x="16" y="30" class="k">PROCESSING</text><text x="16" y="56" class="t">Adaptive engine</text><text x="16" y="78" class="s">Pandas · Spark</text></g>
<g transform="translate(740,70)"><rect width="190" height="100" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#f0abfc"/><text x="16" y="30" class="k" style="fill:#f0abfc">MACHINE LEARNING</text><text x="16" y="56" class="t">Isolation Forest</text><text x="16" y="78" class="s">anomaly detection</text></g>
<g transform="translate(975,70)"><rect width="190" height="100" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#2dd4bf"/><text x="16" y="30" class="k" style="fill:#2dd4bf">OUTPUT</text><text x="16" y="56" class="t">Detection results</text><text x="16" y="78" class="s">anomalies detected</text></g>

<path class="f" d="M227 120 H264" marker-end="url(#ar)"/>
<path class="f" d="M462 120 H499" marker-end="url(#ar)"/>
<path class="f" d="M697 120 H734" marker-end="url(#ar)"/>
<path class="f" d="M932 120 H969" marker-end="url(#ar)"/>

<g transform="translate(505,250)"><rect width="190" height="100" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#fbbf24"/><text x="16" y="30" class="k" style="fill:#fbbf24">OBSERVABILITY</text><text x="16" y="56" class="t">Prometheus</text><text x="16" y="78" class="s">8 metrics</text></g>
<g transform="translate(740,250)"><rect width="190" height="100" rx="14" fill="url(#card)" stroke="#2d2547"/><rect x="16" width="40" height="3" rx="1.5" fill="#fbbf24"/><text x="16" y="30" class="k" style="fill:#fbbf24">MONITORING</text><text x="16" y="56" class="t">Grafana</text><text x="16" y="78" class="s">dashboards</text></g>
<path class="f" d="M600 172 V244" marker-end="url(#ar)"/>
<text x="614" y="214" class="l">exposes metrics</text>
<path class="f" d="M697 300 H734" marker-end="url(#ar)"/>

<text x="35" y="376" class="s">Docker Compose · 6 containers</text>
</svg>
